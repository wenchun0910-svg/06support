<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>長安國小｜六年級數學學習扶助測驗</title>
    
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- 引入日式風格字體 Noto Serif TC (思源宋體) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&display=swap" rel="stylesheet">
    
    <!-- 引入 Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- Tailwind 日式風格設定 -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'wabi-bg': '#F4F1EA',     // 鳥の子色 (背景)
                        'wabi-main': '#2C3E50',   // 鐵紺 (主文字/邊框)
                        'wabi-accent': '#C14545', // 臙脂 (強調/錯誤/印章色)
                        'wabi-green': '#79896D',  // 鶯色 (正確/輔助)
                    },
                    fontFamily: {
                        serif: ['"Noto Serif TC"', 'serif'],
                    },
                    boxShadow: {
                        'wabi': '4px 4px 0px 0px #2C3E50', // 硬邊陰影
                    }
                }
            }
        }
    </script>

    <style>
        body { font-family: 'Noto Serif TC', serif; background-color: #F4F1EA; color: #2C3E50; }
        .stamp {
            border: 2px solid #C14545;
            color: #C14545;
            border-radius: 4px;
            padding: 2px 8px;
            font-weight: bold;
            display: inline-block;
            transform: rotate(-5deg);
        }
        /* 自訂單選框樣式 */
        input[type="radio"] { accent-color: #2C3E50; }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8 flex items-center justify-center">

    <!-- 1. 登入介面 -->
    <div id="login-screen" class="w-full max-w-md bg-white p-8 rounded-sm shadow-wabi border-2 border-wabi-main">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold mb-2 tracking-widest">數學能力測驗</h1>
            <p class="text-wabi-main/70">長安國小 六年級學習扶助</p>
        </div>
        <form id="login-form" class="space-y-6">
            <div>
                <label class="block mb-2 font-bold tracking-wider">學生姓名</label>
                <input type="text" id="student-name" required class="w-full border-2 border-wabi-main bg-wabi-bg p-3 rounded-sm focus:outline-none focus:ring-2 focus:ring-wabi-accent" placeholder="請輸入姓名">
            </div>
            <div>
                <label class="block mb-2 font-bold tracking-wider">登入密碼</label>
                <input type="password" id="student-pwd" required class="w-full border-2 border-wabi-main bg-wabi-bg p-3 rounded-sm focus:outline-none focus:ring-2 focus:ring-wabi-accent" placeholder="請輸入密碼">
            </div>
            <button type="submit" class="w-full bg-wabi-main text-white font-bold py-3 rounded-sm shadow-wabi hover:bg-wabi-main/90 transition-colors">
                進入測驗
            </button>
        </form>
    </div>

    <!-- 2. 測驗介面 -->
    <div id="quiz-screen" class="hidden w-full max-w-3xl bg-white p-6 md:p-10 rounded-sm shadow-wabi border-2 border-wabi-main">
        <div class="flex justify-between items-center border-b-2 border-wabi-main pb-4 mb-6">
            <h2 class="text-2xl font-bold tracking-widest">學習扶助測驗 <span class="stamp ml-2">嚴選</span></h2>
            <div class="text-lg">考生：<span id="display-name" class="font-bold"></span></div>
        </div>
        
        <div id="quiz-container" class="space-y-8 mb-8">
            <!-- 題目會透過 JS 動態產生在這裡 -->
        </div>

        <button id="submit-quiz" class="w-full bg-wabi-accent text-white font-bold py-4 rounded-sm shadow-wabi text-lg tracking-widest hover:bg-red-800 transition-colors">
            交卷並分析成績
        </button>
    </div>

    <!-- 3. 儀表板與分析介面 -->
    <div id="dashboard-screen" class="hidden w-full max-w-5xl space-y-8">
        <div class="bg-white p-8 rounded-sm shadow-wabi border-2 border-wabi-main text-center relative">
            <h2 class="text-3xl font-bold tracking-widest mb-4">測驗分析報告</h2>
            <div class="text-5xl font-bold text-wabi-accent mb-2" id="final-score">0 分</div>
            <p class="text-lg">考生：<span id="dash-name" class="font-bold"></span></p>
            <button id="btn-restart" class="absolute top-8 right-8 border-2 border-wabi-main px-4 py-2 rounded-sm hover:bg-wabi-bg font-bold">
                重新測驗
            </button>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <!-- 雷達圖：能力分佈 -->
            <div class="bg-white p-6 rounded-sm shadow-wabi border-2 border-wabi-main flex flex-col items-center">
                <h3 class="text-xl font-bold mb-4 w-full border-b-2 border-wabi-main pb-2">單元掌握度分析</h3>
                <div class="w-full max-w-xs">
                    <canvas id="radarChart"></canvas>
                </div>
            </div>

            <!-- AI 建議區塊 -->
            <div class="bg-white p-6 rounded-sm shadow-wabi border-2 border-wabi-main">
                <h3 class="text-xl font-bold mb-4 border-b-2 border-wabi-main pb-2">專屬學習建議</h3>
                <div id="advice-content" class="space-y-4 text-lg leading-relaxed">
                    <!-- 建議動態產生 -->
                </div>
                <div class="mt-6 p-4 bg-wabi-bg border-l-4 border-wabi-green">
                    <p class="font-bold">💡 均一教育平台指引：</p>
                    <p class="text-sm mt-1">建議登入均一平台，針對上述較弱的單元重新觀看教學影片並完成指派任務。</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase 與應用程式邏輯 -->
    <script type="module">
        // 匯入 Firebase 模組
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        // ==========================================
        // ⚠️ 請將以下替換為你的 Firebase 專案設定！⚠️
        // ==========================================
  const firebaseConfig = {
  apiKey: "AIzaSyBhgWYgAcaK2UmAeivCFEA-3GMstVAaqSE",
  authDomain: "support-8f876.firebaseapp.com",
  projectId: "support-8f876",
  storageBucket: "support-8f876.firebasestorage.app",
  messagingSenderId: "20070208887",
  appId: "1:20070208887:web:93c07c98361587f8e73d72"
};


        // 初始化 Firebase (加入 try-catch 避免未設定時網頁直接當掉)
        let db;
        try {
            const app = initializeApp(firebaseConfig);
            db = getFirestore(app);
        } catch (error) {
            console.warn("Firebase 尚未設定，將暫時略過資料庫儲存功能。");
        }

        // 全域變數記錄當前學生 (解決 appId is not defined 的問題)
        let currentStudentId = "";
        let currentStudentName = "";
        let radarChartInstance = null;

        // --- 題庫定義 (20 題) ---
        const questionBank = [
            { id: 1, unit: '數與量', text: '請問 24 和 36 的最大公因數是多少？', options: ['6', '12', '18', '24'], answer: 1 },
            { id: 2, unit: '數與量', text: '計算 3/4 + 1/6 = ？', options: ['4/10', '11/12', '5/12', '4/24'], answer: 1 },
            { id: 3, unit: '空間與形狀', text: '一個長方體的長、寬、高分別是 5公分、4公分、3公分，它的體積是多少立方公分？', options: ['12', '32', '60', '120'], answer: 2 },
            { id: 4, unit: '代數', text: '如果 X + 15 = 40，那麼 X 等於多少？', options: ['15', '25', '35', '55'], answer: 1 },
            { id: 5, unit: '資料與不確定性', text: '小明五次數學小考成績為：80, 90, 85, 95, 100。平均分數是多少？', options: ['88', '90', '92', '95'], answer: 1 },
            { id: 6, unit: '數與量', text: '將 0.75 化為最簡分數為何？', options: ['1/2', '3/4', '4/5', '7/10'], answer: 1 },
            { id: 7, unit: '數與量', text: '一件衣服打 8 折後的價格是 400 元，這件衣服原價是多少元？', options: ['480', '500', '520', '600'], answer: 1 },
            { id: 8, unit: '空間與形狀', text: '半徑 10 公分的圓，其面積大約是多少平方公分？(圓周率以3.14計算)', options: ['31.4', '62.8', '314', '628'], answer: 2 },
            { id: 9, unit: '關係', text: '甲和乙的錢數比是 3:2，如果甲有 300 元，乙有多少元？', options: ['100', '150', '200', '450'], answer: 2 },
            { id: 10, unit: '代數', text: '哥哥今年 Y 歲，妹妹比哥哥小 4 歲，妹妹今年幾歲？', options: ['Y + 4', 'Y - 4', '4 - Y', '4Y'], answer: 1 },
            { id: 11, unit: '數與量', text: '哪一個數是 7 的倍數？', options: ['27', '37', '42', '54'], answer: 2 },
            { id: 12, unit: '數與量', text: '2.5 ÷ 0.5 = ？', options: ['0.5', '5', '1.25', '12.5'], answer: 1 },
            { id: 13, unit: '空間與形狀', text: '正方體的每一個面都是什麼形狀？', options: ['長方形', '正方形', '平行四邊形', '菱形'], answer: 1 },
            { id: 14, unit: '關係', text: '地圖上 1 公分代表實際距離 500 公尺，這張地圖的比例尺是多少？', options: ['1:500', '1:5000', '1:50000', '1:500000'], answer: 2 },
            { id: 15, unit: '資料與不確定性', text: '丟一顆公正的六面骰子，出現偶數的機率是多少？', options: ['1/6', '1/3', '1/2', '2/3'], answer: 2 },
            { id: 16, unit: '數與量', text: '下列哪個數是質數？', options: ['9', '15', '21', '23'], answer: 3 },
            { id: 17, unit: '數與量', text: '一瓶果汁有 1.25 公升，4 瓶果汁共有多少公升？', options: ['4.25', '4.5', '5', '5.25'], answer: 2 },
            { id: 18, unit: '空間與形狀', text: '三角形的內角和是多少度？', options: ['90度', '180度', '270度', '360度'], answer: 1 },
            { id: 19, unit: '代數', text: '方程式 3X = 18 的解是多少？', options: ['3', '6', '9', '15'], answer: 1 },
            { id: 20, unit: '關係', text: '如果一輛車 2 小時開了 120 公里，它的平均時速是多少公里？', options: ['60', '100', '120', '240'], answer: 0 }
        ];

        let currentQuizQuestions = [];

        // --- 工具函式：隨機洗牌 ---
        function shuffle(array) {
            const newArr = [...array];
            for (let i = newArr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [newArr[i], newArr[j]] = [newArr[j], newArr[i]];
            }
            return newArr;
        }

        // --- 介面切換邏輯 ---
        const loginScreen = document.getElementById('login-screen');
        const quizScreen = document.getElementById('quiz-screen');
        const dashboardScreen = document.getElementById('dashboard-screen');

        // 登入事件
        document.getElementById('login-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const name = document.getElementById('student-name').value;
            const pwd = document.getElementById('student-pwd').value;
            
            // 簡單密碼驗證 (實務上應由後端處理)
            if(pwd.length < 3) {
                alert("密碼錯誤或太短！");
                return;
            }

            // 設定全域變數 (作為學生的唯一識別，修正 appId 錯誤)
            currentStudentId = name + "_" + pwd;
            currentStudentName = name;
            
            document.getElementById('display-name').textContent = name;
            document.getElementById('dash-name').textContent = name;
            
            startQuiz();
        });

        // 開始測驗
        function startQuiz() {
            loginScreen.classList.add('hidden');
            dashboardScreen.classList.add('hidden');
            quizScreen.classList.remove('hidden');
            
            // 洗牌並選出 20 題 (這裡題庫剛好 20 題，洗牌後全上)
            currentQuizQuestions = shuffle(questionBank).slice(0, 20);
            renderQuestions();
        }

        // 渲染題目
        function renderQuestions() {
            const container = document.getElementById('quiz-container');
            container.innerHTML = '';

            currentQuizQuestions.forEach((q, index) => {
                const qDiv = document.createElement('div');
                qDiv.className = 'p-4 border-2 border-wabi-main/20 rounded-sm bg-white hover:border-wabi-main transition-colors';
                
                let optionsHtml = '';
                q.options.forEach((opt, optIdx) => {
                    optionsHtml += `
                        <label class="flex items-center space-x-3 p-2 hover:bg-wabi-bg rounded cursor-pointer">
                            <input type="radio" name="q_${index}" value="${optIdx}" class="w-5 h-5 text-wabi-main">
                            <span class="text-lg">${opt}</span>
                        </label>
                    `;
                });

                qDiv.innerHTML = `
                    <div class="mb-3 flex items-start">
                        <span class="bg-wabi-main text-white px-2 py-1 text-sm rounded-sm mr-3 mt-1 whitespace-nowrap">第 ${index + 1} 題</span>
                        <h3 class="text-xl font-bold leading-relaxed">${q.text} <span class="text-sm text-wabi-main/50 ml-2">(${q.unit})</span></h3>
                    </div>
                    <div class="space-y-2 ml-14">
                        ${optionsHtml}
                    </div>
                `;
                container.appendChild(qDiv);
            });
        }

        // --- 交卷與計算成績 ---
        document.getElementById('submit-quiz').addEventListener('click', async () => {
            let correctCount = 0;
            const unitStats = {
                '數與量': { total: 0, correct: 0 },
                '空間與形狀': { total: 0, correct: 0 },
                '代數': { total: 0, correct: 0 },
                '關係': { total: 0, correct: 0 },
                '資料與不確定性': { total: 0, correct: 0 }
            };

            let allAnswered = true;

            currentQuizQuestions.forEach((q, index) => {
                const selected = document.querySelector(`input[name="q_${index}"]:checked`);
                unitStats[q.unit].total += 1;
                
                if (selected) {
                    if (parseInt(selected.value) === q.answer) {
                        correctCount++;
                        unitStats[q.unit].correct += 1;
                    }
                } else {
                    allAnswered = false;
                }
            });

            if (!allAnswered) {
                const confirmSubmit = confirm("還有題目未作答，確定要交卷嗎？");
                if (!confirmSubmit) return;
            }

            const finalScore = Math.round((correctCount / currentQuizQuestions.length) * 100);
            
            // 將成績存入 Firebase (已修正變數錯誤，使用 currentStudentId)
            if (db) {
                try {
                    await addDoc(collection(db, "quiz_results"), {
                        studentId: currentStudentId,
                        studentName: currentStudentName,
                        score: finalScore,
                        unitStats: unitStats,
                        timestamp: serverTimestamp()
                    });
                    console.log("成績已儲存至資料庫！");
                } catch (error) {
                    console.error("儲存成績失敗：", error);
                }
            }

            showDashboard(finalScore, unitStats);
        });

        // --- 顯示儀表板與分析 ---
        function showDashboard(score, stats) {
            quizScreen.classList.add('hidden');
            dashboardScreen.classList.remove('hidden');

            // 1. 顯示總分
            const scoreEl = document.getElementById('final-score');
            scoreEl.textContent = `${score} 分`;
            if (score >= 80) scoreEl.className = "text-5xl font-bold text-wabi-green mb-2";
            else if (score >= 60) scoreEl.className = "text-5xl font-bold text-wabi-main mb-2";
            else scoreEl.className = "text-5xl font-bold text-wabi-accent mb-2";

            // 2. 繪製雷達圖
            const labels = Object.keys(stats);
            const dataRates = labels.map(label => {
                if(stats[label].total === 0) return 100; // 防呆
                return Math.round((stats[label].correct / stats[label].total) * 100);
            });

            if (radarChartInstance) radarChartInstance.destroy();
            const ctx = document.getElementById('radarChart').getContext('2d');
            
            // Chart.js 預設字體改為思源宋體
            Chart.defaults.font.family = '"Noto Serif TC", serif';
            
            radarChartInstance = new Chart(ctx, {
                type: 'radar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: '單元答對率 (%)',
                        data: dataRates,
                        backgroundColor: 'rgba(44, 62, 80, 0.2)', // 鐵紺透明
                        borderColor: '#2C3E50',
                        pointBackgroundColor: '#C14545',
                        pointBorderColor: '#fff',
                        pointHoverBackgroundColor: '#fff',
                        pointHoverBorderColor: '#C14545'
                    }]
                },
                options: {
                    scales: {
                        r: {
                            angleLines: { color: 'rgba(44, 62, 80, 0.3)' },
                            grid: { color: 'rgba(44, 62, 80, 0.2)' },
                            pointLabels: {
                                font: { size: 14, weight: 'bold' },
                                color: '#2C3E50'
                            },
                            ticks: { display: false, min: 0, max: 100 }
                        }
                    },
                    plugins: { legend: { display: false } }
                }
            });

            // 3. 產生個人化建議
            const adviceContainer = document.getElementById('advice-content');
            adviceContainer.innerHTML = '';
            
            let weakUnits = [];
            let strongUnits = [];
            
            labels.forEach((label, i) => {
                if (stats[label].total > 0) {
                    if (dataRates[i] < 60) weakUnits.push(label);
                    else if (dataRates[i] >= 80) strongUnits.push(label);
                }
            });

            let adviceText = `<p>哈囉，<strong>${currentStudentName}</strong>：</p>`;
            
            if (weakUnits.length === 0) {
                adviceText += `<p>太棒了！你的數學基礎非常扎實，各個單元都掌握得很好。請繼續保持這份熱情！</p>`;
            } else {
                if (strongUnits.length > 0) {
                    adviceText += `<p>你在 <span class="font-bold text-wabi-green">【${strongUnits.join('、')}】</span> 單元表現得很不錯喔！</p>`;
                }
                adviceText += `<p>根據測驗結果，你在 <span class="font-bold text-wabi-accent border-b-2 border-wabi-accent">【${weakUnits.join('、')}】</span> 這幾個部分還需要多加練習。</p>`;
                
                adviceText += `<ul class="list-disc list-inside mt-2 space-y-1 text-sm text-wabi-main/80">`;
                if(weakUnits.includes('數與量')) adviceText += `<li><strong>數與量：</strong> 建議重新複習因數、倍數與小數分數的運算規則。</li>`;
                if(weakUnits.includes('空間與形狀')) adviceText += `<li><strong>空間與形狀：</strong> 可以多畫圖幫助理解面積與體積的公式由來。</li>`;
                if(weakUnits.includes('代數')) adviceText += `<li><strong>代數：</strong> 試著把未知數 X 當作一個「神祕盒子」，運用等量公理來解題。</li>`;
                adviceText += `</ul>`;
            }
            
            adviceContainer.innerHTML = adviceText;
        }

        // 重新測驗按鈕
        document.getElementById('btn-restart').addEventListener('click', () => {
            startQuiz(); // 重新洗牌並測驗
            window.scrollTo(0, 0);
        });

    </script>
</body>
</html>
